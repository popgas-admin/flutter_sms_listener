group 'br.com.popgas.flutter_sms_listener'
version '1.0-SNAPSHOT'

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'br.com.popgas.flutter_sms_listener'
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Flutter 3.22+ uses Java 17 on Android
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        disable += ['InvalidPackage']
    }
}

dependencies {
    // Kotlin stdlib (optional with Kotlin plugin, but explicit is fine)
    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    // SMS Retriever API (official current versions from docs)
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.2.0'
}
